# colors palette
palette:
  text: DarkGray
  text_light: Gray
  text_dark: Black
  no_bg: Reset
  fg_dark: Gray
  bg_dark: DarkGray
  fg_light: DarkGray
  bg_light: Gray
  white: White
  black: Black
  red: Red
  green: Green
  blue: Blue
  yellow: Yellow
  cyan: Cyan
  magenta: Magenta
  light_red: LightRed
  light_green: LightGreen
  light_blue: LightBlue
  light_yellow: LightYellow
  light_magenta: LightMagenta
  light_cyan: LightCyan
  select_yellow: '#877248'
  select_dark: '#2D446F'

# style anchors
filter: &filter
  header: fg_light:bg_light
  filter:
    prompt: light_blue:bg_dark
    input: light_cyan:light_yellow:bg_dark
    cursor: Reset:#C4C7CC
    error: light_red:bg_dark
    button: light_blue:bg_dark
  items:
    normal: fg_dark:yellow:bg_dark
    accent: fg_light:blue:bg_light
yaml: &yaml
  normal: text:no_bg
  property: green:no_bg
  string: text_light:no_bg
  numeric: blue:no_bg
  language: light_blue:no_bg
  timestamp: magenta:no_bg
  search: select_yellow
  select: select_dark
logs: &logs
  string: text_light:no_bg
  info: text:no_bg
  error: red:no_bg
  timestamp: magenta:no_bg
  search: select_yellow
  select: select_dark
  containers:
  - green
  - blue
  - cyan
  - yellow

# theme itself
colors:
  text: text_light:no_bg
  cursor: fg_light:bg_light
  header:
    text: fg_dark:light_yellow:bg_dark
    context: white:#D80060
    namespace: text:#FDCA4F
    resource: text:#5CA6E3
    name: text:#E5E9F0
    count: text:#AAD92E
    info: white:#9971C3
    disconnected: white:light_red
    previous: text:no_bg
  footer:
    text: fg_dark:#A4A6B8:bg_dark
    trail: blue:yellow:bg_dark
    info: light_green:bg_dark
    error: light_red:bg_dark
    hint: black:yellow:bg_dark
    details:
      text: fg_dark:#A4A6B8:bg_dark
      hint: fg_light:bg_light
      info:
        normal: light_green:bg_dark
        accent: text_dark:light_green
      error:
        normal: light_red:bg_dark
        accent: text_dark:light_red
  filter: *filter
  search: *filter
  command_palette: *filter
  mouse_menu: *filter
  modal:
    text: fg_dark:bg_dark
    textbox:
      caption:
        normal: fg_dark:bg_dark
        hovered: light_cyan:bg_dark
        focused: light_magenta:bg_dark
      input: light_cyan:light_yellow:bg_dark
      cursor: Reset:#C4C7CC
    checkbox:
      normal: fg_dark:bg_dark
      hovered: light_cyan:bg_dark
      focused: light_magenta:bg_dark
    selector:
      caption:
        normal: fg_dark:bg_dark
        hovered: light_cyan:bg_dark
        focused: light_magenta:bg_dark
      items:
        normal: fg_dark:yellow:bg_dark
        accent: fg_light:blue:bg_light
    btn_accent:
      normal: fg_dark:bg_dark
      hovered: fg_light:blue
      focused: fg_light:light_blue
    btn_delete:
      normal: fg_dark:bg_dark
      hovered: fg_light:red
      focused: fg_light:light_red
    btn_cancel:
      normal: fg_dark:bg_dark
      hovered: fg_light:green
      focused: fg_light:light_green
  side_select:
    filter:
      input: light_blue:bg_dark
    items:
      normal: fg_dark:yellow:bg_dark
      accent: fg_light:blue:bg_light
  list:
    header:
      focused: fg_dark:light_yellow:bg_dark
      dimmed: fg_dark:text_dark:bg_dark
    line:
      ready:
        normal: light_blue:no_bg
        accent: text_dark:light_blue
        selected:
          normal: light_green:no_bg
          accent: text_dark:light_green
      in_progress:
        normal: red:no_bg
        accent: text_dark:light_red
        selected:
          normal: light_green:no_bg
          accent: text_dark:light_green
      terminating:
        normal: magenta:no_bg
        accent: text_dark:light_magenta
        selected:
          normal: light_green:no_bg
          accent: text_dark:light_green
      completed:
        normal: text_light:no_bg
        accent: text_light:bg_dark
        selected:
          normal: light_green:no_bg
          accent: text_dark:light_green
      dimmed:
        normal: text_light:no_bg
        accent: text_light:no_bg
    line_cached:
      ready:
        normal: text:no_bg
        accent: text:light_blue
      in_progress:
        normal: text:no_bg
        accent: text:light_red
      terminating:
        normal: text:no_bg
        accent: text:light_magenta
      completed:
        normal: text:no_bg
        accent: text_dark:bg_dark
      dimmed:
        normal: text:no_bg
        accent: text:no_bg
  shell:
    select: select_dark
  syntax:
    describe: *yaml
    yaml: *yaml
    logs: *logs
